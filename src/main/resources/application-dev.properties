spring.config.import=optional:file:.env[.properties]

## Database settings ##
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?sslMode=preferred&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

## Logging settings ##
#logging.level.root=INFO default
logging.level.gr.aueb.cf.eduapp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

logging.file.name=logs/eduapp.log

spring.jpa.properties.hibernate.format_sql=true

file.upload.dir=uploads/

app.security.secret-key=${JWT_SECRET_KEY}
app.security.jwt-expiration=10800000

allowed.origins=http://localhost:5174

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB